# Netlify configuration for Souvenir Galore (Next.js 16).
# Netlify detects Next.js and installs its Next.js runtime automatically:
# pages, API routes, server actions and the proxy all run as Netlify Functions.
# Do NOT add a catch-all "/* /index.html 200" redirect: this is not a static
# single-page app, and Next.js handles every route (including refreshes).
# See docs/NETLIFY.md for the step-by-step guide.

[build]
  # Production: update the database tables, load the starting data, create the
  # first owner (only if ADMIN_EMAIL/ADMIN_PASSWORD are set), then build.
  command = "npm run netlify-build"
  publish = ".next"
  # Skip the production build when a push only changes docs, tests, CI or
  # other files that aren't part of the website. On Netlify's credit-based
  # plans every successful production deploy uses credits.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)docs' ':(exclude)tests' ':(exclude).github' ':(exclude)*.md' ':(exclude)scripts/live-check.mjs' ':(exclude)scripts/backup.sh' ':(exclude)playwright.config.ts' ':(exclude)vitest.config.ts' ':(exclude)docker-compose.yml' ':(exclude)Dockerfile' ':(exclude).dockerignore' ':(exclude)vercel.json' ':(exclude).env.example' ':(exclude)netlify.env.example'"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Deploy previews and branch deploys only build the site: they never change
# the database during the build.
[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"
